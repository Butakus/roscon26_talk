# distrobox assemble create --file distrobox.ini
# Ubuntu + ROS 2 rolling, integrated with the host: same $HOME, same user,
# GUI, USB devices and network. Only the userland is Ubuntu.
[easynav-rolling]
# The official ROS image: Ubuntu 26.04 with ros-rolling-ros-base already set up
image=docker.io/library/ros:rolling-ros-base
pull=true
additional_packages="python3-colcon-common-extensions python3-vcstool python3-rosdep gdb clangd"
# Do not touch the host's /usr: keep the box self-contained
init=false
nvidia=false
start_now=true
